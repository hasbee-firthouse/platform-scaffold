# Local development stack (SPEC §20.1) + an opt-in production-image service.
#
#   Local dev flow (SPEC §20.1):
#     docker compose up -d            # Postgres 16 + Mailpit only
#     pnpm install
#     pnpm db:migrate && pnpm seed    # migrate, then seed dev data
#     pnpm dev                        # API :3000, Vite :5173 proxying /api
#     → Mailpit UI at http://localhost:8025
#
#   Bring up the PRODUCTION image (builds the Dockerfile, boots API + SPA):
#     docker compose --profile app up --build
#     # then, once (against the same db): DATABASE_URL=... pnpm db:migrate
#
# `app` lives behind the `app` profile so a plain `docker compose up` starts only
# the backing services the host-run dev flow needs.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d platform']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # The single production image (Fastify serves /api/* + the built SPA). Opt in
  # with `--profile app`. Env below mirrors the Zod-validated boot contract
  # (apps/api/src/env.ts); replace the dev placeholders for a real deployment.
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/platform
      BETTER_AUTH_SECRET: local-dev-secret-change-me
      GOOGLE_CLIENT_ID: dev-google-client-id
      GOOGLE_CLIENT_SECRET: dev-google-client-secret
      SMTP_URL: smtp://mailpit:1025
      LOG_LEVEL: info
    ports:
      - '3000:3000'

volumes:
  pgdata:
